services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://pgvector:5432/rag
      DB_USERNAME: rag
      DB_PASSWORD: rag
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
    ports:
      - "8094:8080"
    depends_on:
      pgvector:
        condition: service_healthy
